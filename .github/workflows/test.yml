name: Test Setup

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  verify:
    name: Verify setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest, ubuntu-24.04-arm]
        target:
          - channel: sts
            version: 0.53.13
          - channel: sts
            version: latest
          - channel: lts
            version: 1.0.0
          - channel: lts
            version: latest
          - channel: nightly
            version: 1.1.0-alpha.20260429010057
        sdk_target: [""]
        include:
          - os: windows-latest
            target:
              channel: sts
              version: 1.1.0
            sdk_target: ohos
          - os: windows-latest
            target:
              channel: nightly
              version: 1.1.0-alpha.20260429010057
            sdk_target: ohos
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl
          echo "DYLD_LIBRARY_PATH=$(brew --prefix openssl)/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Test on ${{ matrix.os }}
        uses: ./
        with:
          channel: ${{ matrix.target.channel }}
          version: ${{ matrix.target.version }}
          target: ${{ matrix.sdk_target }}
      - name: Verify setup
        shell: bash
        run: |
          cjc --version
          if [ -z "${{ matrix.sdk_target }}" ]; then
            # Native toolchain: build and run a sample project end-to-end.
            mkdir cjbuild
            cd cjbuild
            cjpm init
            cjpm run
          fi
          # For a cross-compile target SDK, `cjc --version` above already
          # verifies the target environment is wired up (CANGJIE_HOME/PATH point
          # at the target SDK). A default cjpm project would target the cross
          # platform and can't be built/run meaningfully on the host runner.
